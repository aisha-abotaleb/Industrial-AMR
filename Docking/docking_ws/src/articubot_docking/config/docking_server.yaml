# Parameters for opennav_docking (ros-humble-opennav-docking)
# NOTE: `dock_database` is injected by launch/docking_server.launch.py (absolute path).
docking_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    initial_perception_timeout: 20.0   # how long to wait for the first /detected_dock_pose
    wait_charge_timeout: 5.0
    dock_approach_timeout: 40.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.05
    use_collision_detection: true
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"                # TF frame the docking controller works in
    dock_backwards: false              # camera is on the FRONT of the robot -> dock forward
    dock_prestaging_tolerance: 0.5     # if robot is farther than this from the staging pose, Nav2 must drive it there

    dock_plugins: ['articubot_dock']
    articubot_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05          # no battery/stall sensing in sim -> "docked" = within 5 cm of target
      staging_x_offset: -0.75          # staging pose = 0.75 m BEHIND the docked pose (dock yaw = robot heading when docked)
      staging_yaw_offset: 0.0
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      stall_velocity_threshold: 1.0
      stall_effort_threshold: 1.0
      charging_threshold: 0.5

      external_detection_timeout: 1.0
      # /detected_dock_pose is already published with the heading INTO the wall, z up
      # (see scripts/dock_pose_publisher.py) -> no extra rotation needed here.
      external_detection_rotation_roll: 0.0
      external_detection_rotation_pitch: 0.0
      external_detection_rotation_yaw: 0.0
      # Where base_link should end up, measured from the tag plane (negative = in front of the tag).
      # Keep >= 0.40 m: the front camera sits ~5 cm ahead of base_link and must still see the whole tag.
      external_detection_translation_x: -0.45
      external_detection_translation_y: 0.0
      filter_coef: 0.1

    controller:
      k_phi: 3.0
      k_delta: 2.0
      beta: 0.4
      lambda: 2.0
      v_linear_min: 0.05
      v_linear_max: 0.15
      v_angular_max: 0.75
      slowdown_radius: 0.25
      # Needs Nav2's local costmap running (/local_costmap/costmap_raw). Turn on after Nav2 works on Humble.
      use_collision_detection: false
      costmap_topic: "/local_costmap/costmap_raw"
      footprint_topic: "/local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3
